# =============================================================================
# Dependabot Configuration - Pagayo Marketing
# =============================================================================
# Astro static site — dependency security scanning
# 
# STRATEGIE:
# - MAJOR updates: Individueel (breaking changes vereisen aparte review)
# - MINOR/PATCH updates: Gegroepeerd per categorie
# - Security updates: Altijd individueel en prioriteit
# 
# Docs: https://docs.github.com/en/code-security/dependabot
# =============================================================================

version: 2
updates:
  # ===========================================================================
  # NPM Dependencies
  # ===========================================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    
    groups:
      # Astro ecosystem - minor/patch samen
      astro-ecosystem:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - "minor"
          - "patch"
      
      # Build tools - minor/patch samen
      build-tools:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "esbuild"
          - "typescript"
        update-types:
          - "minor"
          - "patch"
      
      # Linting/formatting - minor/patch samen
      code-quality:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      
      # Type definitions - altijd samen
      type-definitions:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # ===========================================================================
  # GitHub Actions
  # ===========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
