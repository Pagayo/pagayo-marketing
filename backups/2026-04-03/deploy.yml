name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

env:
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  # ===========================================================================
  # JOB 1: Validate
  # ===========================================================================
  validate:
    name: Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check (Astro)
        run: npx astro check || echo "⚠️ Type check completed with warnings"

      - name: Lint
        run: npm run lint || echo "⚠️ No lint script configured"

  # ===========================================================================
  # JOB 2: Deploy
  # ===========================================================================
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [validate]
    # Deploy alleen op push naar main of workflow_dispatch — NIET op PRs
    # Dependabot PRs hebben geen toegang tot CLOUDFLARE_API_TOKEN
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      deployments: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build metadata
        id: build_meta
        run: |
          echo "timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "commit_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      
      - name: Build Astro site
        run: npm run build
        env:
          NODE_ENV: production
          BUILD_TIMESTAMP: ${{ steps.build_meta.outputs.timestamp }}
          GIT_COMMIT: ${{ steps.build_meta.outputs.commit_short }}
      
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
        run: |
          echo "🚀 Deploying to Cloudflare Pages..."
          echo "📦 Build: ${{ steps.build_meta.outputs.commit_short }} @ ${{ steps.build_meta.outputs.timestamp }}"
          npx wrangler pages deploy dist \
            --project-name=pagayo-marketing \
            --branch=${{ github.head_ref || github.ref_name }} \
            --commit-hash=${{ github.sha }} \
            --commit-message="Deploy ${{ steps.build_meta.outputs.commit_short }}"

      - name: Wait for deployment propagation
        run: sleep 10

      - name: Health check
        run: |
          echo "🔍 Checking site at https://www.pagayo.com..."
          
          for i in 1 2 3; do
            if curl -sf "https://www.pagayo.com" > /dev/null 2>&1; then
              echo "✅ Site is live (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i failed, waiting..."
            sleep 5
          done
          
          echo "⚠️ Health check completed with warnings"
          exit 0

  # ===========================================================================
  # JOB 3: Summary
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [deploy]
    # Summary alleen als deploy job daadwerkelijk heeft gerund
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    steps:
      - name: Create deployment summary
        run: |
          echo "## 🌟 Marketing Site Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ needs.deploy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "- **Production:** https://www.pagayo.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloudflare Dashboard:** https://dash.cloudflare.com/${{ env.CF_ACCOUNT_ID }}/pages" >> $GITHUB_STEP_SUMMARY
